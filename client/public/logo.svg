<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SpeedNet Arena logo">
  <defs>
    <linearGradient id="clayBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="0.55" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#F79E93" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#5b4b8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Puffy rounded badge -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#clayBadge)" filter="url(#soft)" />
  <rect x="6" y="6" width="52" height="52" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Orbiting network nodes + links -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" fill="none">
    <line x1="16" y1="20" x2="32" y2="32" />
    <line x1="48" y1="18" x2="32" y2="32" />
    <line x1="18" y1="46" x2="32" y2="32" />
    <line x1="47" y1="47" x2="32" y2="32" />
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="20" r="3.2" />
    <circle cx="48" cy="18" r="3.2" />
    <circle cx="18" cy="46" r="3.2" />
    <circle cx="47" cy="47" r="3.2" />
  </g>

  <!-- Lightning bolt -->
  <path d="M35 15 L22 35 L31 35 L28 49 L43 27 L33 27 Z"
        fill="#FDE68A" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
</svg>
